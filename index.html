<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="総合占術">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>総合占術</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: 暦の台帳。縦一列の罫線帳で、四柱の大きな干支文字を主役にし、他は静かに並べる */
:root{
  --bg:#eef1ef; --surface:#f8faf8; --fg:#16212b; --muted:#566570; --line:#cdd6d1; --soft:#e1e8e4;
  --accent:#1d4f73; --accent-fg:#ffffff; --warn:#a4421f;
  --wood:#3d7a4c; --fire:#b4432d; --earth:#8f6c1f; --metal:#5f6f7d; --water:#25559a;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#151e26; --fg:#e4ebee; --muted:#93a1ab; --line:#2a3743; --soft:#1b2630;
    --accent:#7db4d9; --accent-fg:#0b1218; --warn:#f0906c;
    --wood:#7bc28a; --fire:#ef8b72; --earth:#d8b25a; --metal:#a5b4c1; --water:#78a7ee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#151e26; --fg:#e4ebee; --muted:#93a1ab; --line:#2a3743; --soft:#1b2630;
  --accent:#7db4d9; --accent-fg:#0b1218; --warn:#f0906c;
  --wood:#7bc28a; --fire:#ef8b72; --earth:#d8b25a; --metal:#a5b4c1; --water:#78a7ee;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:32px;min-width:0}
h1{font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:.16em;line-height:1.2;margin:0}
.lede{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:34em}
h2{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.06em;line-height:1.4;margin:0;padding-bottom:8px;border-bottom:1px solid var(--fg);text-wrap:balance}
h3{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.05em;margin:0 0 6px}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:64px;min-width:0}
.sub{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:4px}
.warn{color:var(--warn)}

/* form */
form{display:grid;gap:18px}
.fld{display:grid;gap:6px;min-width:0}
.fld>label:not(.chk){font-size:13px;font-weight:700;letter-spacing:.04em}
#out{display:flex;flex-direction:column;gap:32px;min-width:0}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;min-width:0;min-height:48px;padding:10px 12px;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px}
input:disabled{opacity:.45}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.chk input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.go{min-height:56px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-fg);font:700 17px var(--sans);letter-spacing:.3em;cursor:pointer}
.err{color:var(--warn);font-size:14px;min-height:1.4em}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
.nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.nav button{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;font:500 14px var(--sans);cursor:pointer}

/* summary */
.core{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.08em;line-height:1.5;text-wrap:balance}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:5.6em 1fr 2.4em;align-items:center;gap:10px;font-size:14px}
.bar .t{height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.rows{display:grid;margin:0}
.rows>div{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows dt{color:var(--muted);font-size:13px;padding-top:2px}
.rows dd{margin:0;min-width:0}
.rows b{font-family:var(--serif);font-size:17px;letter-spacing:.04em}
.rows p{font-size:14px;margin-top:2px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 8px;font-size:12.5px;margin:2px 4px 2px 0}

/* four pillars */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 2px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.pl{font-size:12px;color:var(--muted);letter-spacing:.1em}
.god{font-size:12.5px;font-weight:700;min-height:1.8em;padding-top:2px}
.glyph{font-family:var(--serif);font-weight:700;font-size:42px;line-height:1.18}
.hid{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.yomi{font-size:11px;color:var(--muted);line-height:1.5}
.pc.unk .pg{font-family:var(--serif);font-size:20px;color:var(--muted);padding-block:44px}
.el0{color:var(--wood)}.el1{color:var(--fire)}.el2{color:var(--earth)}.el3{color:var(--metal)}.el4{color:var(--water)}
.dy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dy>div{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 4px;text-align:center}
.dy>div.now{border-color:var(--accent);background:var(--soft)}
.dy .a{font-size:12px;color:var(--muted)}
.dy .g{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.3}
.dy .j{font-size:11.5px}

/* astrology */
.wheel{width:100%;max-width:440px;height:auto;display:block;margin-inline:auto}
.w-ring{fill:none;stroke:var(--line);stroke-width:1}
.w-ring.o{stroke:var(--fg)}
.w-tick{stroke:var(--line);stroke-width:1}
.w-sign{fill:var(--muted);font-family:var(--serif);font-size:11px;text-anchor:middle;dominant-baseline:central}
.w-pl{fill:var(--fg);font-family:var(--serif);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}
.w-pl.sun{fill:var(--accent)}
.w-pt{stroke:var(--fg);stroke-width:1.4}
.w-ax{stroke:var(--accent);stroke-width:1.4}
.w-lab{fill:var(--accent);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--sans)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}

/* nine star board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 2px;text-align:center;min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.cell .d{font-size:11.5px;color:var(--muted)}
.cell .s{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.3}
.cell .m{font-size:11px;font-weight:700;color:var(--warn);line-height:1.4}
.cell.bad{border-color:var(--warn)}
.cell.ctr{background:var(--soft)}
.big{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:.04em}
.kv{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.kv>div{min-width:0}
.kv .sub{display:block}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
/* readings */
.st{color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.st .off{color:var(--line)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--muted);vertical-align:-2px;margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.tile .t{font-family:var(--serif);font-weight:700;font-size:16px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .r{font-size:13px;font-weight:700}
.blk{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.pcard h3{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:18px;margin:0}
.pcard h3 .sub{font-family:var(--sans);font-weight:400}
.sc{display:grid;grid-template-columns:3.2em auto 1fr;gap:4px 10px;align-items:center;font-size:14px}
.sc .rl{font-size:12.5px;color:var(--muted)}
.pcard .rows>div:last-child{border-bottom:0}
.pcard .rows>div{grid-template-columns:5.6em minmax(0,1fr)}
.fr{display:grid;grid-template-columns:5.6em auto minmax(0,1fr);gap:2px 10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.fr.now{background:var(--soft);margin-inline:-8px;padding-inline:8px}
.fr .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.fr .x{min-width:0;font-size:13.5px}
.cl{display:grid;gap:10px}
.cl>div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cl dt{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.nav button{transition:background .15s}}
</style>

<main class="wrap">
  <header>
    <h1>総合占術</h1>
    <p class="lede">四柱推命・西洋占星術・九星気学・数秘術・血液型を、生年月日と出生地から一度に鑑定します。</p>
  </header>

  <form id="f" novalidate>
    <div class="fld">
      <label for="name">呼び名 <span class="opt">任意</span></label>
      <input id="name" type="text" autocomplete="off" maxlength="20" placeholder="例：はるか">
    </div>
    <div class="fld">
      <label for="date">生年月日</label>
      <input id="date" type="date" min="1900-01-01" max="2100-12-31" required>
    </div>
    <div class="fld">
      <label for="time">出生時刻</label>
      <input id="time" type="time">
      <label class="chk"><input id="unk" type="checkbox"><span>時刻がわからない（時柱と上昇星座は出しません）</span></label>
      <p class="hint">母子手帳に書いてあることが多いです。</p>
    </div>
    <div class="fld">
      <label for="place">出生地</label>
      <select id="place"></select>
      <div id="custom" class="row3" hidden>
        <div class="fld"><label for="lat">緯度</label><input id="lat" type="number" step="0.01" value="35.69"></div>
        <div class="fld"><label for="lon">経度</label><input id="lon" type="number" step="0.01" value="139.69"></div>
        <div class="fld"><label for="off">UTC差</label><input id="off" type="number" step="0.5" value="9"></div>
      </div>
      <label class="chk"><input id="cor" type="checkbox" checked><span>出生地の経度で時刻を補正する（時柱の精度が上がります）</span></label>
      <label class="chk"><input id="dst" type="checkbox"><span>サマータイム（夏時間）の期間だった</span></label>
    </div>
    <div class="row2">
      <div class="fld">
        <label for="gender">性別</label>
        <select id="gender">
          <option value="x">答えない</option>
          <option value="m">男性</option>
          <option value="f">女性</option>
        </select>
      </div>
      <div class="fld">
        <label for="blood">血液型</label>
        <select id="blood">
          <option value="">わからない</option>
          <option value="A">A型</option>
          <option value="B">B型</option>
          <option value="O">O型</option>
          <option value="AB">AB型</option>
        </select>
      </div>
    </div>
    <p class="hint">性別は、四柱推命で10年ごとの運の流れ（大運）の向きを決めるためだけに使います。</p>
    <p id="err" class="err" role="alert"></p>
    <button class="go" type="submit">占う</button>
  </form>

  <div id="out" hidden></div>

  <p class="foot">天文計算による近似です。節入りは数分から十数分、惑星の位置は最大1度ほどずれることがあります。時刻が節入りや日付の境目に近いときは、専用の暦でも確認してください。占いは自己理解と楽しみのための参考として使ってください。</p>
</main>

 {n:'田畑',t:['協調','安定'],x:'養う力のある田畑。世話好きで受容的、人や物を育てて支えるのが得意です。'},
 {n:'鉄',t:['行動','独立'],x:'鍛えられた鉄。決断が早く、白黒をはっきりさせる改革派です。義理堅い一面もあります。'},

const GOD={
 '比肩':{k:'自立・対等',y:'自分の力で進む年です。自立と対等な関係がテーマになり、出費の見直しにも向きます。',m:'自分のペースを守ると安定します。'},
 '劫財':{k:'競争・仲間',y:'競争や付き合いが増える年です。見栄の出費に気をつけ、協力者を大切にすると安定します。',m:'付き合いの出費や競争心に注意する月です。'},
 '食神':{k:'楽しみ・表現',y:'楽しみと表現が広がる年です。趣味や発信が実を結びやすくなります。',m:'楽しみや発信がうまくいきやすい月です。'},
 '傷官':{k:'才能・批評',y:'才能が際立つ年です。批評や衝動的な発言に気をつけながら、技を磨くのに向きます。',m:'感性が冴える反面、言葉の強さに注意する月です。'},
 '偏財':{k:'流動・出会い',y:'お金の動きと出会いが活発な年です。チャンスに乗る行動力が運を呼びます。',m:'人との出会いやお金の動きが活発な月です。'},
 '正財':{k:'堅実・蓄財',y:'堅実に蓄える年です。仕事の成果が収入に結びつきやすくなります。',m:'仕事の成果が堅実に積み上がる月です。'},

 '正官':{k:'責任・信用',y:'評価と責任が増える年です。信用を積むほど立場が上がります。',m:'評価や責任が増え、信用を積む月です。'},
 '偏印':{k:'発想・学び',y:'学びと転換の年です。新しい分野や、ひとりの時間が力になります。',m:'学びやひらめきに向く、内向きの月です。'},
 '正印':{k:'支援・安心',y:'支援と学びの年です。資格の勉強や休養が実を結び、守られている安心感があります。',m:'休養と学びで力を蓄えるのに向く月です。'}
};

const ELX={
 0:{k:'成長・計画',s:'新しい学びや計画づくり、植物や散歩で補えます。'},
 1:{k:'情熱・表現',s:'人前で表現する、温かい食事や運動で補えます。'},

/* ---------- astronomy ---------- */
function sunLon(jd){
  const T=(jd-2451545.0)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*D2R;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*D2R;
  return mod360(L0+C-0.00569-0.00478*Math.sin(om));
}
function moonLon(jd){
  const T=(jd-2451545.0)/36525;
  const Lp=218.3164477+481267.88123421*T, D=297.8501921+445267.1114034*T, M=357.5291092+35999.0502909*T,
        Mp=134.9633964+477198.8675055*T, F=93.2720950+483202.0175233*T;
  const s=x=>Math.sin(x*D2R);
  return mod360(Lp+6.288774*s(Mp)+1.274027*s(2*D-Mp)+0.658314*s(2*D)+0.213618*s(2*Mp)-0.185116*s(M)-0.114332*s(2*F)
    +0.058793*s(2*D-2*Mp)+0.057066*s(2*D-M-Mp)+0.053322*s(2*D+Mp)+0.045758*s(2*D-M)-0.040923*s(M-Mp)
    -0.034720*s(D)-0.030383*s(M+Mp)+0.015327*s(2*D-2*F)-0.012528*s(Mp+2*F)+0.010980*s(Mp-2*F));
}

function kepler(Mdeg,e){
  const M=Mdeg*D2R; let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
  for(let k=0;k<12;k++){const dE=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); E-=dE; if(Math.abs(dE)<1e-10)break;}
  return E;
}
function sunXY(d){
  const w=282.9404+4.70935e-5*d, e=0.016709-1.151e-9*d, M=mod360(356.0470+0.9856002585*d);
  const E=kepler(M,e), xv=Math.cos(E)-e, yv=Math.sqrt(1-e*e)*Math.sin(E);
  const lon=Math.atan2(yv,xv)+w*D2R, r=Math.hypot(xv,yv);
  return {x:r*Math.cos(lon),y:r*Math.sin(lon)};
}
function planetLon(name,jd){
  const d=jd-2451543.5, p=PL[name];
  const N=(p.N[0]+p.N[1]*d)*D2R, inc=(p.i[0]+p.i[1]*d)*D2R, w=(p.w[0]+p.w[1]*d)*D2R, e=p.e[0]+p.e[1]*d, M=mod360(p.M[0]+p.M[1]*d);
  const E=kepler(M,e), xv=p.a*(Math.cos(E)-e), yv=p.a*Math.sqrt(1-e*e)*Math.sin(E);
  const vw=Math.atan2(yv,xv)+w, r=Math.hypot(xv,yv);
  const xh=r*(Math.cos(N)*Math.cos(vw)-Math.sin(N)*Math.sin(vw)*Math.cos(inc));
  const yh=r*(Math.sin(N)*Math.cos(vw)+Math.cos(N)*Math.sin(vw)*Math.cos(inc));
  const s=sunXY(d);
  return mod360(Math.atan2(yh+s.y,xh+s.x)/D2R);
}
function bodyLon(k,jd){ return k==='sun'?sunLon(jd):k==='moon'?moonLon(jd):planetLon(k,jd); }
function ascmc(jd,lat,lon){
  const d=jd-2451545.0, gmst=mod360(280.46061837+360.98564736629*d);
  const th=mod360(gmst+lon)*D2R, eps=(23.4393-3.563e-7*d)*D2R, phi=lat*D2R;
  const mc=mod360(Math.atan2(Math.sin(th),Math.cos(th)*Math.cos(eps))/D2R);
  const asc=mod360(Math.atan2(Math.cos(th),-(Math.sin(th)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))/D2R);
  return {asc,mc};
}

/* ---------- calendar ---------- */
function dayIndex(y,m,d){
  const jdn=Math.floor(Date.UTC(y,m-1,d)/86400000)+2440588;
  return mod(jdn-2451545+54,60);
}
function cycleIdx(s,b){ for(let k=0;k<6;k++){const i=s+10*k; if(i%12===b)return i;} return 0; }

  const rel=mod(STEM_EL[x]-STEM_EL[dm],5), same=(dm%2)===(x%2);
  return [['比肩','劫財'],['食神','傷官'],['偏財','正財'],['七殺','正官'],['偏印','正印']][rel][same?0:1];
}
function nearestTerm(jd,dir){
  const lam=sunLon(jd), m=Math.floor(mod360(lam-315)/30);
  const target=dir>0?(315+30*((m+1)%12))%360:(315+30*m)%360;
  const diff=dir>0?mod360(target-lam):mod360(lam-target);
  let t=jd+dir*diff/0.9856;
  for(let k=0;k<6;k++){const e=mod(target-sunLon(t)+540,360)-180; t+=e/0.9856;}
  return t;
}

  const g=[1,4,7].includes(hon)?8:[2,5,8].includes(hon)?2:5;
  return mod(g-1-mIdx,9)+1;
}

  let daiun=null;
  if(inp.gender==='m'||inp.gender==='f'){
    const fwd=(ys%2===0&&inp.gender==='m')||(ys%2===1&&inp.gender==='f');
    const days=fwd?tNext-jdUT:jdUT-tPrev;
    const yrs=Math.floor(days/3), mons=Math.floor((days/3-yrs)*12);
    const base=cycleIdx(ms,mb), list=[];
    for(let k=0;k<9;k++){const idx=mod(base+(fwd?1:-1)*(k+1),60); list.push({s:idx%10,b:idx%12,age:yrs+10*k,god:tenGod(dS,idx%10)});}
    const ageNow=(nowMs-utMs)/(365.2425*86400000);
    let cur=-1; list.forEach((x,k)=>{if(ageNow>=x.age+mons/12)cur=k;});
    daiun={fwd,yrs,mons,list,cur,ageNow};
  }

  // western
  const jdOf=h=>(Date.UTC(inp.y,inp.m-1,inp.d,h,0)-off*3600000)/86400000+2440587.5;
  const planets=PLANETS.map(([k,n,g])=>{
    const lon=bodyLon(k,jdUT);
    let retro=false;
    if(k!=='sun'&&k!=='moon'){const dd=mod(bodyLon(k,jdUT+0.5)-bodyLon(k,jdUT-0.5)+180,360)-180; retro=dd<0;}
    return {k,n,g,lon,sign:Math.floor(lon/30),deg:lon%30,retro};
  });
  let ac=null; if(inp.timeKnown) ac=ascmc(jdUT,inp.place.lat,inp.place.lon);
  let moonAlt=null;
  if(!inp.timeKnown){
    const a=Math.floor(moonLon(jdOf(0))/30), b=Math.floor(moonLon(jdOf(24))/30);
    if(a!==b) moonAlt=[a,b];
  }
  const aspects=[];
  for(let i=0;i<planets.length;i++)for(let j=i+1;j<planets.length;j++){
    const dlt=angDiff(planets[i].lon,planets[j].lon);
    for(const [ang,nm,orb,tx] of ASPECTS){const o=Math.abs(dlt-ang); if(o<=orb){aspects.push({a:planets[i].n,b:planets[j].n,nm,orb:o,tx});break;}}
  }
  aspects.sort((p,q)=>p.orb-q.orb);
  const elems={火:0,地:0,風:0,水:0};
  planets.forEach(p=>elems[SIGNS[p.sign].el]++);
  if(ac) elems[SIGNS[Math.floor(ac.asc/30)].el]++;

  // 九星
  const hon=honmei(Y), mStar=monthStarOf(hon,mIdx);

  // numerology
  const life=reduceNum(sumDigits(inp.y)+sumDigits(inp.m)+sumDigits(inp.d),true);
  const birthNum=reduceNum(inp.d,true);

  // now
  const nj=new Date(nowMs+9*3600000), ny=nj.getUTCFullYear(), nm=nj.getUTCMonth()+1, nd=nj.getUTCDate();
  const lamN=sunLon(nowMs/86400000+2440587.5);
  let nY=ny; if(nm===1||(nm===2&&lamN<315)) nY--;
  const nMi=Math.floor(mod360(lamN-315)/30);
  const nys=mod(nY-4,10), nyb=mod(nY-4,12);
  const nms=mod(mod(nys,5)*2+2+nMi,10), nmb=(2+nMi)%12;
  const nyStar=honmei(nY), nmStar=monthStarOf(nyStar,nMi);
  const bY=boardOf(nyStar), bM=boardOf(nmStar);
  const py=reduceNum(sumDigits(inp.m)+sumDigits(inp.d)+sumDigits(ny),false);
  const now={y:ny,m:nm,d:nd,ys:nys,yb:nyb,ms:nms,mb:nmb,yGod:tenGod(dS,nys),mGod:tenGod(dS,nms),
    yStar:nyStar,mStar:nmStar,bY,bM,mkY:marksOf(bY,hon),mkM:marksOf(bM,hon),py};

  // fortune by day / month / year
  const mnE=Math.min(...elCount), mxE=Math.max(...elCount);
  const lack=[], exc=[];
  elCount.forEach((c,i)=>{ if(c===mnE&&mnE<=1)lack.push(i); if(c===mxE&&mxE>=3)exc.push(i); });
  lack.sort((a,b)=>((a-dS_el(dS)+5)%5+1)%5-((b-dS_el(dS)+5)%5+1)%5); lack.splice(2);
  const period=(stem,unit)=>{
    const god=tenGod(dS,stem), el=STEM_EL[stem];
    const sc=SC[god].slice();
    if(inp.gender==='m'||inp.gender==='f') sc[1]=(inp.gender==='m'?LOVE_M:LOVE_F)[god];
    let adj=0, why='';
    if(lack.includes(el)){adj=1; why=`不足している${EL[el]}の気が入る${unit}なので、追い風です。`;}
    else if(exc.includes(el)){adj=-1; why=`もともと多い${EL[el]}の気がさらに強まる${unit}なので、やや過剰になりやすいです。`;}
    let ce, cwhy;
    if(lack.includes(el)){ce=el; cwhy=`不足している${EL[el]}の気を、色でも後押しします。`;}
    else if(exc.includes(el)){ce=(el+1)%5; cwhy=`強まる${EL[el]}の気を、${EL[ce]}の色で流します。`;}
    else if(lack.length){ce=lack[0]; cwhy=`不足している${EL[ce]}の気を補います。`;}
    else {ce=STEM_EL[dS]; cwhy='バランスが良いので、日主の色が安定をくれます。';}
    return {stem,god,el,sc:sc.map(v=>Math.max(1,Math.min(5,v+adj))),why,ce,cwhy};
  };
  const dayOf=(y,m,d)=>{const i=dayIndex(y,m,d); const p=period(i%10,'日'); p.pillar=[i%10,i%12]; p.m=m; p.d=d; p.w=new Date(Date.UTC(y,m-1,d)).getUTCDay(); return p;};
  const week=[]; for(let k=0;k<7;k++){const t=new Date(nowMs+9*3600000+k*86400000); week.push(dayOf(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()));}
  const fMonth=period(nms,'月'); fMonth.pillar=[nms,nmb];
  const fYear=period(nys,'年'); fYear.pillar=[nys,nyb];
  const flow=[]; { let ty=nY, tm=nMi;
    for(let k=0;k<12;k++){
      const ysT=mod(ty-4,10), msT=mod(mod(ysT,5)*2+2+tm,10), mbT=(2+tm)%12;
      const p=period(msT,'月'); p.pillar=[msT,mbT]; p.cm=((tm+1)%12)+1; p.cy=tm===11?ty+1:ty; flow.push(p);
      tm++; if(tm===12){tm=0; ty++;}
    } }
  const fortune={day:week[0],week,month:fMonth,year:fYear,flow,lack,exc};

  // integration
  const sunS=planets[0].sign, moonS=planets[1].sign, ascS=ac?Math.floor(ac.asc/30):null;
  const src=[
    {k:'日主',w:2,t:DM[dS].t,v:`${STEMS[dS]}（${DM[dS].n}）`,x:DM[dS].x},
    {k:'太陽星座',w:2,t:SIGNS[sunS].t,v:`${SIGNS[sunS].n}座`,x:SIGNS[sunS].sun},
    {k:'月星座',w:1.5,t:SIGNS[moonS].t,v:`${SIGNS[moonS].n}座`,x:SIGNS[moonS].moon},
  ];
  if(ascS!==null) src.push({k:'上昇星座',w:1,t:SIGNS[ascS].t,v:`${SIGNS[ascS].n}座`,x:SIGNS[ascS].asc});
  src.push({k:'本命星',w:1.5,t:KY[hon-1].t,v:KY[hon-1].n,x:KY[hon-1].x});
  src.push({k:'月命星',w:1,t:KY[mStar-1].t,v:KY[mStar-1].n,x:`内面や本音は「${KY[mStar-1].k}」の気質です。`});
  src.push({k:'ライフパス',w:1.5,t:NUM[life].t,v:String(life),x:NUM[life].x});
  if(inp.blood) src.push({k:'血液型',w:1,t:BLOOD[inp.blood].t,v:`${inp.blood}型`,x:BLOOD[inp.blood].x});
  const score={}; const who={};
  AXES.forEach(([id])=>{score[id]=0; who[id]=[];});
  src.forEach(s=>s.t.forEach(t=>{score[t]+=s.w; who[t].push(s.k);}));
  const mx=Math.max(...Object.values(score));
  const axes=AXES.map(([id,label])=>({id,label,pct:Math.round(score[id]/mx*100),who:who[id]})).sort((a,b)=>b.pct-a.pct||b.who.length-a.who.length);

  return {Y,mIdx,pillars,elCount,daiun,nearMin,setsuDay,usedTime:`${String(ud.getUTCHours()).padStart(2,'0')}:${String(ud.getUTCMinutes()).padStart(2,'0')}`,
    corrected,planets,asc:ac&&ac.asc,mc:ac&&ac.mc,moonAlt,aspects:aspects.slice(0,6),elems,
    hon,mStar,life,birthNum,now,src,axes,fortune};
}
</script>

function wheelSVG(r){

   <div class="blk"><h3>金運</h3>

  // 3. today / month / year (each its own tab)
  const dpl=F.day;

  h+=`<section class="sec" id="sec-today" hidden><h2>今日の運勢</h2>
   <p class="sub">${n.y}年${n.m}月${n.d}日（${wdOf(n.y,n.m,n.d)}）時点。${how}</p>
   ${periodCard('今日',`${n.m}月${n.d}日（${wdOf(n.y,n.m,n.d)}）・${pillarName(dpl.pillar[0],dpl.pillar[1])}の日`,dpl,`今日は「${GOD[dpl.god].k}」がテーマの日です。`)}${tail}</section>`;
  h+=`<section class="sec" id="sec-month" hidden><h2>今月の運勢</h2>

  // 4. flow
  const flow=F.flow;

   <h3>これからの12か月</h3>

   <div>${flow.map((p,k)=>`<div class="fr${k===0?' now':''}"><span class="d">${p.cy}年${p.cm}月</span>${stars(p.sc[0])}<span class="x">${GOD[p.god].k}。${strongOf(p).length?strongOf(p).join('・')+'が追い風':'落ち着いた月'}。色は${colorOf(p.ce).replace(/・.*/,'')}</span></div>`).join('')}</div></section>`;

  // 5. color
  const own=STEM_EL[dm], lack=F.lack, exc=F.exc;
  h+=`<section class="sec" id="sec-color" hidden><h2>色と数字</h2>
   <dl class="cl">
    <div><dt>あなたの色</dt><dd>${colorOf(own)}<p class="sub">日主の五行（${EL[own]}）の色です。身につけると落ち着き、本来の自分に戻れます。</p></dd></div>
    <div><dt>ラッキーカラー</dt><dd>${lack.length?lack.map(colorOf).join('<br>'):'好きな色で大丈夫です'}<p class="sub">${lack.length?`五行で不足している${lack.map(e=>EL[e]).join('・')}の気を補う色です。服、バッグ、財布、スマホケースなど、毎日目に入る小物から取り入れてください。`:'五行のバランスが良く、特定の色で補う必要はありません。'}</p></dd></div>
    ${exc.length?`<div><dt>控えめにする色</dt><dd>${exc.map(colorOf).join('<br>')}<p class="sub">もともと多い${exc.map(e=>EL[e]).join('・')}の気が強まりすぎる時に、使いすぎると偏りが出やすい色です。使ってはいけないわけではなく、小物程度にとどめる目安です。</p></dd></div>`:''}
    <div><dt>九星の色</dt><dd>${KYCOL[r.hon-1].map(c=>`${sw(c[1])}${c[0]}`).join('　')}<p class="sub">本命星（${KY[r.hon-1].n}）に伝わる色です。</p></dd></div>

  if(r.daiun){

  // 7. astro
  const sp=r.planets;
  h+=`<section class="sec" id="sec-astro" hidden><h2>西洋占星術の計算結果</h2>

   <div class="scroll"><table class="tbl"><thead><tr><th>天体</th><th>位置</th><th></th></tr></thead><tbody>

   <dl class="rows">

    ${[['mercury','水星','考え方・話し方'],['venus','金星','愛し方・好み'],['mars','火星','行動の仕方'],['jupiter','木星','運の伸ばし方'],['saturn','土星','課題と成長の軸']].map(([k,nn,role])=>{const p=sp.find(x=>x.k===k);return `<div><dt>${nn}</dt><dd><b>${SIGNS[p.sign].n}座</b><p>${role}は「${SIGNS[p.sign].kw}」な傾向です。</p></dd></div>`;}).join('')}

  // 8. kyusei
  const K=KY[r.hon-1], M=KY[r.mStar-1];
  const okDirs=POS.filter((_,i)=>i>0&&!n.mkM[i].length&&!n.mkY[i].length);
  h+=`<section class="sec" id="sec-kyusei" hidden><h2>九星気学</h2>
   <div class="kv"><div><span class="sub">本命星</span><span class="big">${K.n}</span></div><div><span class="sub">月命星</span><span class="big">${M.n}</span></div></div>
   <p>${K.x}</p><p>月命星の${M.n}は、内面や本音の傾向を表します。「${M.k}」の気質が、気を許した場面で出やすくなります。</p>
   <h3>今月の方位（${KY_SHORT[n.mStar-1]}が中央）</h3>
   ${boardHTML(n.bM,n.mkM,r.hon)}
   ${markLine(n.bM,n.mkM,'今月')}
   ${markLine(n.bY,n.mkY,'今年')}
   <p>今月と今年のどちらにも凶方位のマークがない方角は、${okDirs.length?okDirs.join('・'):'ありません'}です。引っ越しや旅行の方角を選ぶ時の目安にしてください。</p>
   <p class="sub">五黄殺と暗剣殺は大凶とされる方角、本命殺と本命的殺は自分の星に関わる凶方位です。上が南です。歳破・月破・定位対冲は含めていません。本命星は立春、月命星は節入りで切り替わります。</p></section>`;

  // 9. numerology & blood
  const L=NUM[r.life], B=inp.blood?BLOOD[inp.blood]:null;
  h+=`<section class="sec" id="sec-num" hidden><h2>数秘術・血液型</h2>
   <dl class="rows">
    <div><dt>ライフパス</dt><dd><b>${r.life}　${L.k}</b><p>${L.x}</p></dd></div>
    <div><dt>誕生数</dt><dd><b>${r.birthNum}　${NUM[r.birthNum].k}</b><p>生まれた日が示す、才能の入口です。${NUM[r.birthNum].x}</p></dd></div>
    <div><dt>今年</dt><dd><b>パーソナルイヤー ${n.py}</b><p>${PY[n.py]}</p></dd></div>
    <div><dt>血液型</dt><dd>${B?`<b>${inp.blood}型</b><p>${B.x}</p>`:'<p>未入力です。</p>'}</dd></div>
   </dl>
   <p class="sub">血液型の性格分類は日本で広く親しまれている文化的な遊びで、科学的な根拠は確立していません。話のきっかけとして楽しむ程度にしてください。</p>
   <h3>占術ごとの結果一覧</h3>
   <dl class="rows">${r.src.map(s=>`<div><dt>${s.k}</dt><dd><b>${s.v}</b><p>${s.x}</p></dd></div>`).join('')}</dl></section>`;

  const out=$('out'); out.innerHTML=h; out.hidden=false;
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const secs=[...out.querySelectorAll('section.sec')], btns=[...out.querySelectorAll('[data-tab]')];
  const show=id=>{
    secs.forEach(x=>{x.hidden=x.id!==id;});
    btns.forEach(b=>{const on=b.dataset.tab===id; b.setAttribute('aria-selected',String(on));});
    const cur=btns.find(b=>b.dataset.tab===id); if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
    const t=$(id); if(t)t.scrollIntoView({block:'start'});
  };
  btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
  if(secs[0])secs[0].hidden=false;
}

function run(sample){
  const r=readForm();
  if(r.error){$('err').textContent=r.error; return;}
  $('err').textContent='';
  let res;
  try{res=analyze(r.inp,Date.now());}catch(e){$('err').textContent='計算中に問題が起きました。入力内容を確認してください。'; return;}
  render(res,r.inp,sample);
  if(!sample){saveForm(); $('sec-sum').scrollIntoView({block:'start'});}
}
$('f').addEventListener('submit',e=>{e.preventDefault(); run(false);});

(function init(){
  const had=loadForm();
  if(!had) setSample();
  syncForm();
  run(!had);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
